<script type="text/javascript">
    RED.nodes.registerType('docling', {
        category: 'document processing',
        color: 'burlywood',
        defaults: {
            name: { value: '' },
            dynamic: { value: false },
            fromFormat: {
                value: 'pdf, docx, pptx, html, image, asciidoc, md, csv, xlsx, json_docling',
            },
            source: {
                value: '',
                validate: function (v) {
                    if (
                        $('#node-input-dynamic').length
                            ? $('#node-input-dynamic').prop('checked')
                            : this.dynamic
                    )
                        return true;
                    if (!v || v.trim() === '') return false;

                    var builtInValidator = RED.validators.typedInput('sourceType');
                    return builtInValidator.call(this, v);
                },
            },
            sourceType: { value: 'str' },
            toFormat: { value: 'md' },
            output: { value: '' },
            outputType: { value: 'str' },
            imageExportMode: { value: 'embedded' },

            tables: { value: true },
            tableMode: { value: 'accurate' },
            enrichCode: { value: false },
            enrichFormula: { value: false },
            enrichPictureClasses: { value: false },
            enrichChartExtraction: { value: false },

            ocr: { value: true },
            forceOcr: { value: false },
            ocrEngine: { value: 'auto' },
            ocrLang: { value: 'en' },

            device: { value: 'auto' },
            pdfBackend: { value: 'docling_parse' },
            pipeline: { value: '' },
            vlmModel: { value: 'granite_docling' },
            artifactsPath: { value: '' },
            documentTimeout: { value: '' },
            abortOnError: { value: false },
            profiling: { value: false },
            saveProfiling: { value: false },
        },
        inputs: 1,
        outputs: 1,
        icon: 'docling.svg',
        label: function () {
            return this.name || (!this.dynamic ? ('docling ' + this.source).trim() : 'docling');
        },
        oneditprepare: function () {
            $('#node-input-source').typedInput({
                default: 'str',
                types: ['msg', 'flow', 'global', 'str', 'jsonata', 'env'],
                typeField: $('#node-input-sourceType'),
            });

            $('#node-input-output').typedInput({
                default: 'str',
                types: ['msg', 'flow', 'global', 'str', 'jsonata', 'env'],
                typeField: $('#node-input-outputType'),
            });

            if (this.fromFormat) {
                var fromArr = this.fromFormat.split(',').map(function (item) {
                    return item.trim();
                });
                $('#node-input-fromFormat').val(fromArr);
            }
            if (this.toFormat) {
                var toArr = this.toFormat.split(',').map(function (item) {
                    return item.trim();
                });
                $('#node-input-toFormat').val(toArr);
            }

            $('#node-input-ocr').on('change', function () {
                if ($(this).prop('checked')) $('.row-ocr-options').show();
                else $('.row-ocr-options').hide();
            });

            $('#node-input-tables').on('change', function () {
                if ($(this).prop('checked')) $('#row-tableMode').show();
                else $('#row-tableMode').hide();
            });

            $('#node-input-pipeline').on('change', function () {
                if ($(this).val() === 'vlm') $('#row-vlmModel').show();
                else $('#row-vlmModel').hide();
            });

            $('#node-input-profiling').on('change', function () {
                if ($(this).prop('checked')) $('#row-saveProfiling').show();
                else $('#row-saveProfiling').hide();
            });

            $('#node-input-dynamic').on('change', function () {
                if ($(this).prop('checked')) {
                    $('.form-row-static').hide();
                } else {
                    $('.form-row-static').show();
                    $('#node-input-ocr').trigger('change');
                    $('#node-input-tables').trigger('change');
                    $('#node-input-pipeline').trigger('change');
                    $('#node-input-profiling').trigger('change');
                }
            });

            $('#node-input-dynamic').trigger('change');
        },
        oneditsave: function () {
            var fromVals = $('#node-input-fromFormat').val();
            this.fromFormat = fromVals ? fromVals.join(',') : '';

            var toVals = $('#node-input-toFormat').val();
            this.toFormat = toVals ? toVals.join(',') : '';
        },
    });
</script>

<script type="text/markdown" data-help-name="docling">
    A node to trigger the `docling` CLI to convert documents (PDF, DOCX, etc.) into structured formats (Markdown, JSON).

    ### Prerequisites

    The `docling` CLI must be installed and accessible in the system `$PATH` where Node-RED is running.

    ### Properties

    - **Load from msg.file** _boolean_\
      If enabled, the node will ignore the UI properties and expect standard parameters (like `msg.file.source`, `msg.file.toFormat`, `msg.file.output`, etc.) to be provided dynamically.

    - **Source** _string_\
      Path or URL to the document(s) to process.

    - **Output Dir** _string_\
      Directory to save output files. If blank, uses the current working directory.

    - **To Formats** _string_\
      Comma-separated list of formats to export (e.g. `md`, `json`, `html`, `text`, `doctags`, `vtt`).

    - **OCR Settings** _checkboxes / dropdowns_\
      Toggle OCR, force full-page OCR, and select engines (`easyocr`, `tesseract`, etc.) or language codes.

    ---

    ### Inputs

    - **msg.file** _object_\
      The incoming message parameters. Overrides configured UI properties if dynamic loading is enabled.

    ### Outputs

    - **msg.payload** _string_\
      The standard output (stdout) from the docling CLI command.

    - **msg.error** _string_\
      The error output (stderr) if the command fails.

    - **msg.docling** _object_\
      Contains metadata about the executed command (`command`, `source`, `action`).
</script>
